<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
<title id="title">AgentDock illustrative interface — not a screenshot</title>
<desc id="desc">An annotated design preview of AgentDock's local workspace. A sidebar links to workspace, messages, shared memory and usage. The main view shows example Codex and Claude agents, a session event stream and a disabled run button. Four notes explain explicit execution, peer messages, reviewed memory and AgentMeter quotas. All displayed project and conversation data is illustrative.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#19372c" flood-opacity=".1"/></filter><clipPath id="frame"><rect x="38" y="90" width="1204" height="710" rx="16"/></clipPath></defs>
<rect width="1280" height="1000" fill="#edf1e9"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<text x="40" y="38" font-size="19" font-weight="700" fill="#234837">AgentDock</text><text x="1240" y="35" text-anchor="end" font-size="11" fill="#68826a">ILLUSTRATIVE INTERFACE · MOCK DATA · NOT A SCREENSHOT</text>
<text x="40" y="64" font-size="12" fill="#819476">界面设计示意，非运行截图。示例数据不代表已连接的 Agent、真实额度或实际执行结果。</text>
<rect x="38" y="90" width="1204" height="710" rx="16" fill="#f6f7f3" filter="url(#shadow)"/>
