<rect x="51" y="302" width="185" height="43" rx="7" fill="#345344"/><rect x="51" y="309" width="3" height="28" rx="1.5" fill="#c6d5a7"/>
<g font-size="12"><text x="71" y="329" fill="#e8f0df">▣</text><text x="101" y="329" fill="#e8f0df">协作工作台</text><text x="71" y="381" fill="#a3b99e">◇</text><text x="101" y="381" fill="#a3b99e">协作消息</text><text x="71" y="433" fill="#a3b99e">▱</text><text x="101" y="433" fill="#a3b99e">共享记忆</text><text x="71" y="485" fill="#a3b99e">▥</text><text x="101" y="485" fill="#a3b99e">额度与订阅</text></g>
<circle cx="67" cy="723" r="3" fill="#8ec897"/><text x="79" y="727" font-size="10" fill="#bdceb4">本地服务</text><text x="79" y="744" font-size="9" fill="#729270">数据存于本机</text><text x="64" y="775" font-size="9" fill="#97af8f">断开连接</text>
<rect x="252" y="90" width="990" height="59" fill="#fbfcf8"/><path d="M252 149h990" stroke="#e2e8df"/><text x="282" y="125" font-size="10" fill="#8b9882">示例项目</text><text x="350" y="125" font-size="10" fill="#b9c5ad">/</text><text x="369" y="125" font-size="10" fill="#4f6948">协作工作台</text><rect x="1142" y="109" width="35" height="24" rx="5" fill="none" stroke="#dfe7d8"/><text x="1159" y="125" text-anchor="middle" font-size="9" font-weight="700" fill="#64765b">EN</text><text x="1203" y="127" text-anchor="middle" font-size="19" fill="#8a9b7c">↻</text>
<rect x="281" y="169" width="932" height="35" rx="7" fill="#fcf6e9" stroke="#eee2c7"/><text x="296" y="191" font-size="10" fill="#937441">◇ 执行已关闭 · 连接工作台不会启动 Agent。启用执行后，仍需手动发起每次任务。</text>
<text x="282" y="233" font-size="8" letter-spacing="1.5" fill="#7c956d">YOUR AGENT WORKSPACE</text><text x="280" y="267" font-size="27" font-weight="650" fill="#274638">协作，从这里开始</text><text x="282" y="290" font-size="9" font-family="ui-monospace, monospace" fill="#8b9b7f">/example/workspace</text><rect x="1100" y="244" width="112" height="36" rx="7" fill="#186c57"/><text x="1156" y="267" text-anchor="middle" font-size="11" fill="#fff">＋ 添加 Agent</text>
