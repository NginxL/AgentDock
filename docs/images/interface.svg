<text x="102" y="135" font-size="19" font-weight="700" fill="#e7eee1">AgentDock</text><text x="103" y="149" font-size="6" letter-spacing="1.5" fill="#8da591">ONE SPACE. MANY MINDS.</text>
<text x="61" y="194" font-size="9" fill="#7f9c88" letter-spacing="1.5">当前项目</text><rect x="59" y="205" width="171" height="37" rx="6" fill="#294039" stroke="#385047"/><text x="72" y="229" font-size="11" fill="#d9e6d3">示例项目 / Example</text><path d="m211 220 4 4 4-4" stroke="#a3b799" fill="none"/>
