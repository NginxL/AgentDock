<g font-size="10" fill="#7e9273"><text x="300" y="349">▣ 项目 Agent</text><text x="537" y="349">ϟ 运行中</text><text x="774" y="349">▱ 已审阅记忆</text><text x="1011" y="349">◇ 等待授权</text></g><g font-size="24" fill="#496542"><text x="455" y="351">02</text><text x="692" y="351">00</text><text x="929" y="351">03</text><text x="1163" y="351">00</text></g>
<rect x="282" y="395" width="456" height="100" rx="10" fill="#fcfef9" stroke="#78a580" stroke-width="1.5"/><rect x="756" y="395" width="456" height="100" rx="10" fill="#fff" stroke="#e2e8df"/><rect x="300" y="414" width="33" height="33" rx="9" fill="#e9f0e8"/><text x="316" y="437" text-anchor="middle" font-size="20" fill="#47684a" font-weight="650">C</text><text x="348" y="428" font-size="12" font-weight="650" fill="#2e5039">实现 Agent</text><text x="348" y="445" font-size="9" fill="#8d9f81">Codex · ACP</text><text x="348" y="474" font-size="10" fill="#7e9170">负责功能实现，向审阅 Agent 发送交接说明。</text><rect x="689" y="410" width="34" height="18" rx="9" fill="#f2f6ec"/><text x="706" y="423" text-anchor="middle" font-size="8" fill="#8da27d">待命</text>
<rect x="775" y="414" width="33" height="33" rx="9" fill="#f8eae0"/><text x="791" y="440" text-anchor="middle" font-size="28" fill="#b77751">✳</text><text x="823" y="428" font-size="12" font-weight="650" fill="#2e5039">审阅 Agent</text><text x="823" y="445" font-size="9" fill="#8d9f81">Claude · ACP</text><text x="823" y="474" font-size="10" fill="#7e9170">负责独立审阅，提交共享记忆提案供你确认。</text><rect x="1163" y="410" width="34" height="18" rx="9" fill="#f2f6ec"/><text x="1180" y="423" text-anchor="middle" font-size="8" fill="#8da27d">待命</text>
<rect x="282" y="516" width="230" height="248" rx="10" fill="#fff" stroke="#e2e8df"/><text x="300" y="542" font-size="12" font-weight="600" fill="#3d5a3d">会话</text><text x="300" y="559" font-size="9" fill="#96a788">实现 Agent</text><path d="M282 573h230" stroke="#e9efdf"/><rect x="291" y="583" width="212" height="57" rx="6" fill="#edf3e7"/><text x="303" y="606" font-size="11" fill="#4b6b43">设计共享记忆接口</text><text x="303" y="625" font-size="8" fill="#99ac88">待命 · 示例会话</text><text x="302" y="686" font-size="9" fill="#9cae8c">新会话标题</text><rect x="300" y="697" width="194" height="27" rx="6" fill="#fff" stroke="#e0e9d7"/><text x="309" y="714" font-size="9" fill="#b2bea7">为 Agent 创建一个新任务…</text><rect x="300" y="731" width="194" height="22" rx="5" fill="#f5f8ef"/><text x="397" y="746" text-anchor="middle" font-size="9" fill="#8ea278">＋ 创建会话</text>
<rect x="529" y="516" width="683" height="248" rx="10" fill="#fff" stroke="#e2e8df"/><text x="549" y="543" font-size="12" font-weight="600" fill="#3d5a3d">设计共享记忆接口</text><text x="549" y="560" font-size="8" fill="#9aaa8c">保留事件记录 · 每次执行建立新的 ACP 会话并注入已存上下文</text><path d="M529 574h683" stroke="#e9efdf"/><text x="549" y="597" font-size="8" letter-spacing=".5" fill="#7f9970">EXAMPLE EVENT · ILLUSTRATIVE ONLY</text><text x="549" y="619" font-size="10" fill="#7d9270">这里会展示任务进度、Agent 输出与工具调用记录。</text><text x="549" y="640" font-size="10" fill="#7d9270">需要授权的操作会显示原始请求，由你选择允许或拒绝。</text><rect x="530" y="659" width="681" height="104" rx="0" fill="#fafcf7"/><path d="M529 659h683" stroke="#e9efdf"/><text x="549" y="681" font-size="9" fill="#8fa47c">给 Agent 的任务</text><text x="549" y="707" font-size="10" fill="#acbaa0">描述目标、约束和你希望得到的结果…</text><text x="549" y="742" font-size="8" fill="#a6b595">服务尚未启用执行。</text><rect x="1112" y="720" width="81" height="28" rx="6" fill="#a5c1aa"/><text x="1152" y="739" text-anchor="middle" font-size="10" fill="#fff">运行任务 →</text>
<text x="747" y="786" text-anchor="middle" font-size="8" fill="#a3b193">消息是上下文，不是指令授权。额度重置时间不等于订阅续费日期。</text>
</g>
<g font-size="12" fill="#3e603e"><circle cx="57" cy="844" r="13" fill="#dce7d4"/><text x="57" y="848" text-anchor="middle" font-size="10" font-weight="700">1</text><text x="80" y="847" font-weight="650">明确执行 / Explicit runs</text><text x="80" y="870" font-size="10" fill="#819774">创建会话或发送消息均不会自动启动 Agent。</text><circle cx="662" cy="844" r="13" fill="#dce7d4"/><text x="662" y="848" text-anchor="middle" font-size="10" font-weight="700">2</text><text x="685" y="847" font-weight="650">协作消息 / Peer mailbox</text><text x="685" y="870" font-size="10" fill="#819774">身份绑定、项目隔离，Agent 通过 MCP 收发消息。</text><circle cx="57" cy="916" r="13" fill="#dce7d4"/><text x="57" y="920" text-anchor="middle" font-size="10" font-weight="700">3</text><text x="80" y="919" font-weight="650">共享记忆 / Reviewed memory</text><text x="80" y="942" font-size="10" fill="#819774">提案经人工批准，版本冲突保留草稿并阻止覆盖。</text><circle cx="662" cy="916" r="13" fill="#dce7d4"/><text x="662" y="920" text-anchor="middle" font-size="10" font-weight="700">4</text><text x="685" y="919" font-weight="650">额度与订阅 / AgentMeter usage</text><text x="685" y="942" font-size="10" fill="#819774">按需读取额度；订阅手动登记，未知不表示零。</text></g>
<text x="1240" y="978" text-anchor="end" font-size="9" fill="#97aa8a">AgentDock 0.1 · Design reference · 中文 / English</text>
</g></svg>
