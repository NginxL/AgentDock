[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdock-workbench"
dynamic = ["version"]
description = "Native agent sessions, automatic task handoff, shared memory, and usage in one local workbench"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE*"]
dependencies = []

[tool.setuptools]
packages = ["agentdock"]

[tool.ruff]
required-version = "==0.16.10"
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I"]

[tool.mypy]
python_version = "3.11"
files = ["agentdock/errors.py", "agentdock/text_buffer.py", "agentdock/turn.py"]
strict = true
follow_imports = "silent"

[project.scripts]
agentdock = "agentdock.server:main"

[tool.setuptools.dynamic]
version = {attr = "agentdock.__version__"}

[tool.setuptools.package-data]
agentdock = ["static/*", "static/assets/*", "static/licenses/*"]
