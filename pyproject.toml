[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdock-workbench"
version = "0.3.0"
description = "Native agent sessions, automatic task handoff, shared memory, and usage in one local workbench"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[tool.setuptools]
packages = ["agentdock"]

[tool.ruff]
required-version = "==0.16.10"
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I"]

[tool.mypy]
python_version = "3.11"
files = ["agentdock/errors.py", "agentdock/text_buffer.py", "agentdock/turn.py"]
strict = true
follow_imports = "silent"
