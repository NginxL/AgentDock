name: Optional live CLI verification
on:
  workflow_dispatch:
    inputs:
      confirm_model_usage:
        description: Run on a dedicated runner and consume real CLI model quota
        type: boolean
        default: false
  schedule:
    - cron: '17 20 * * *'
permissions:
  contents: read
concurrency:
  group: live-cli-verification
  cancel-in-progress: false
jobs:
  live:
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm_model_usage) || (github.event_name == 'schedule' && vars.LIVE_E2E_ENABLED == 'true')
    runs-on: [self-hosted, agentdock-live]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify dialogue, resume, dispatch, return and acceptance
        env:
          AGENTDOCK_LIVE_E2E: '1'
        run: python3 scripts/live-e2e.py --live
