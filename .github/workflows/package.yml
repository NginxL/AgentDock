name: Build packages
on:
  workflow_dispatch:
    inputs:
      notarize:
        description: Sign with Developer ID and notarize (requires release secrets)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - run: python -m pip install build==1.4.0
      - run: python -m build
      - run: |
          python -m venv /tmp/agentdock-wheel
          /tmp/agentdock-wheel/bin/pip install --no-deps dist/*.whl
          /tmp/agentdock-wheel/bin/python scripts/check-wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.APPLE_TEMP_KEYCHAIN_PASSWORD }}
      NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv python install --install-dir "$RUNNER_TEMP/portable-python" --no-bin 3.13
      - name: Prepare temporary signing keychain
        if: inputs.notarize
        run: python scripts/release-signing.py prepare
      - name: Build embedded-runtime app
        env:
          NOTARIZE: ${{ inputs.notarize }}
        run: |
          python scripts/release-signing.py build
          swift run --package-path native DesktopChecks
          swift run --package-path native CredentialChecks
          ditto -c -k --keepParent dist/AgentDock.app dist/AgentDock.zip
      - name: Notarize and staple
        if: inputs.notarize
        run: python scripts/release-signing.py notarize
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDock-${{ matrix.runner }}-${{ inputs.notarize && 'notarized' || 'adhoc' }}
          path: dist/AgentDock.zip
      - name: Remove signing material
        if: always() && inputs.notarize
        run: python scripts/release-signing.py cleanup
